
  <!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Videó</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000; color: #fff; }
    body { display: grid; place-items: center; font-family: system-ui, sans-serif; }

    .player {
      position: relative;
      width: min(100vw, 56.25vh);
      width: min(100vw, 56.25dvh);
      height: 100vh;
      height: 100dvh;
      background: #000;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 0;
      border-radius: 999px;
      padding: 1rem 1.4rem;
      background: rgba(0, 0, 0, .8);
      color: #fff;
      font: 600 1rem system-ui, sans-serif;
      white-space: nowrap;
      cursor: pointer;
    }

    #play:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    #error {
      position: absolute;
      top: 50%;
      left: 1rem;
      right: 1rem;
      transform: translateY(-50%);
      padding: 1rem;
      border-radius: .75rem;
      background: rgba(0, 0, 0, .85);
      text-align: center;
      line-height: 1.5;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="player">
    <video
      id="video"
      src="./vegleges.mp4"
      controls
      playsinline
      preload="metadata"
      aria-label="Videólejátszó"
    ></video>

    <button id="play" type="button">▶ Videó indítása</button>

    <p id="error" role="alert" hidden>
      A videó nem tölthető be. Ellenőrizd, hogy a vegleges.mp4
      ugyanabban a mappában van-e, mint az index.html.
    </p>
  </main>

  <script>
    const video = document.getElementById('video');
    const play = document.getElementById('play');
    const error = document.getElementById('error');

    play.addEventListener('click', async () => {
      try {
        await video.play();
      } catch {
        error.textContent =
          'A videó nem indítható. Próbáld megnyitni a vegleges.mp4 fájlt közvetlenül.';
        error.hidden = false;
        play.hidden = true;
      }
    });

    video.addEventListener('playing', () => {
      play.hidden = true;
    });

    video.addEventListener('pause', () => {
      if (!video.ended) play.hidden = false;
    });

    video.addEventListener('ended', () => {
      play.hidden = false;
    });

    video.addEventListener('error', () => {
      play.hidden = true;
      error.hidden = false;
    });
  </script>
</body>
</html>
